[project]
name = "bonsai-backend"
version = "0.2.0"
description = "Bonsai feed filter — ingest API on Cloud Run backed by Firestore"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "google-cloud-firestore>=2.19",
  "google-auth>=2.33",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyrefly>=0.1",
  "pytest>=8.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses `Depends(...)` as a default value; this is
# the framework idiom and not an actual B008 mutable-default issue.
"bonsai/auth.py" = ["B008"]
"bonsai/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
