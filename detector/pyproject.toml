[project]
name = "bonsai-detector"
version = "0.1.0"
description = "Bonsai — experimental AI-content detector service on Cloud Run"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  # CPU-only torch keeps the image small enough for Cloud Run cold-start.
  "torch==2.4.1",
  "transformers>=4.44",
  "huggingface-hub>=0.24",
  "safetensors>=0.4",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyrefly>=0.1",
  "pytest>=8.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
