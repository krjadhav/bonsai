<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bonsai sign-in</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <img class="logo" src="icons/bonsai-48.png" alt="" />
    <div class="titles">
      <div class="title">Bonsai</div>
      <div class="ver" id="verLabel"></div>
    </div>
  </header>
  <section class="auth">
    <p class="lead" id="statusLead">Opening Google sign-in…</p>
    <p class="lead" id="statusDetail" hidden></p>
    <button id="closeBtn" class="btn ghost" hidden>Close</button>
  </section>
  <script src="oauth.js"></script>
</body>
</html>
