<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bonsai</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <img class="logo" src="icons/bonsai-48.png" alt="" />
    <div class="titles">
      <div class="title">Bonsai</div>
      <div class="ver" id="verLabel">v0.5.0</div>
    </div>
    <button id="headerSignOutBtn" class="hdr__signout" hidden title="Sign out" aria-label="Sign out">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </header>

  <!-- Step A: Sign in gate -->
  <section class="auth" id="signedOut">
    <p class="lead">
      Teach your feed what you want to see.<br />
      Sign in to start pruning.
    </p>
    <button id="signInBtn" class="btn primary">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 11v3.2h5.2c-.2 1.3-1.6 3.8-5.2 3.8-3.1 0-5.7-2.6-5.7-5.8S8.9 6.4 12 6.4c1.8 0 3 .8 3.7 1.4l2.5-2.4C16.7 4 14.6 3 12 3 6.9 3 2.8 7.1 2.8 12.2S6.9 21.4 12 21.4c6.9 0 9.3-4.8 9.3-7.3 0-.5 0-.9-.1-1.1H12z"/></svg>
      Sign in with Google
    </button>
  </section>

  <!-- Step B: Slideshow (post sign-in, pre-onboarded) -->
  <section class="tour" id="tour" hidden aria-label="How Bonsai works">
    <div class="stage" id="tourStage" data-step="1" aria-hidden="true">
      <div class="scene scene--rate">
        <div class="mini-tweet">
          <div class="mini-avatar"></div>
          <div class="mini-lines">
            <div class="mini-line w60"></div>
            <div class="mini-line w90"></div>
          </div>
        </div>
        <div class="choice choice--yes" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="choice choice--no" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>

      <div class="scene scene--prune">
        <div class="row row--keep"><span class="dot dot--yes"></span><div class="row-line w70"></div></div>
        <div class="row row--drop"><span class="dot dot--no"></span><div class="row-line w40"></div></div>
        <div class="row row--keep"><span class="dot dot--yes"></span><div class="row-line w80"></div></div>
        <div class="row row--keep"><span class="dot dot--yes"></span><div class="row-line w50"></div></div>
        <div class="row row--drop"><span class="dot dot--no"></span><div class="row-line w60"></div></div>
      </div>

      <div class="scene scene--grow">
        <img class="grown-logo" src="icons/bonsai-128.png" alt="" />
        <div class="confidence">
          <div class="confidence-label">
            <span>Preference model</span>
            <span id="pctLabel">87%</span>
          </div>
          <div class="confidence-bar">
            <div class="confidence-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <h3 class="tour__title" id="tourTitle">Rate what you see</h3>
    <p class="tour__body" id="tourBody">
      On every post, tap the thumb icons to mark it as more like this or less like this.
    </p>

    <div class="tour__footer">
      <div class="step-dots step-dots--manual" id="tourDots">
        <span class="step-dot is-active" data-step="1"></span>
        <span class="step-dot" data-step="2"></span>
        <span class="step-dot" data-step="3"></span>
      </div>
      <div class="tour__actions">
        <button id="tourBackBtn" class="btn ghost" hidden>Back</button>
        <button id="tourNextBtn" class="btn primary">Next</button>
      </div>
    </div>
  </section>

  <!-- Step C: Onboarded home -->
  <section class="home" id="home" hidden>
    <div class="profile">
      <img id="avatar" alt="" />
      <div>
        <div class="who" id="userName"></div>
        <div class="email" id="userEmail"></div>
      </div>
    </div>
    <button id="openXBtn" class="btn primary">
      Open X
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/></svg>
    </button>
    <button id="signOutBtn" class="btn ghost">Sign out</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
