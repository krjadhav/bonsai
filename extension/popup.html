<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bonsai</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <img class="logo" src="icons/bonsai-48.png" alt="" />
    <div class="titles">
      <div class="title">Bonsai</div>
      <div class="ver" id="verLabel">v0.5.0</div>
    </div>
    <button id="headerSignOutBtn" class="hdr__signout" hidden title="Sign out" aria-label="Sign out">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </header>

  <!-- Session expired: user previously signed in but the backend returned 401.
       Shown instead of #home so the sync status is impossible to miss. -->
  <section class="auth" id="stale" hidden>
    <p class="lead stale__lead">
      Your sign-in expired. Sign in again to keep your ratings saving.
    </p>
    <button id="reauthBtn" class="btn primary">
      Sign in again
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/></svg>
    </button>
    <p class="stale__note" id="stalePendingNote" hidden></p>
  </section>

  <!-- Setup gate: either not signed in, or signed in but hasn't finished the tour. -->
  <section class="auth" id="setup" hidden>
    <p class="lead" id="setupLead">
      Teach your feed what you want to see.<br />
      Finish setup to start pruning.
    </p>
    <button id="openOnboardingBtn" class="btn primary">
      Open setup
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/></svg>
    </button>
  </section>

  <!-- Onboarded home -->
  <section class="home" id="home" hidden>
    <div class="profile">
      <img id="avatar" alt="" />
      <div>
        <div class="who" id="userName"></div>
        <div class="email" id="userEmail"></div>
      </div>
    </div>

    <div class="filters" id="filters">
      <div class="filters__row">
        <label class="toggle" for="hideAdsToggle">
          <span>Hide ads</span>
          <input type="checkbox" id="hideAdsToggle" />
          <span class="toggle__switch" aria-hidden="true"></span>
        </label>
      </div>
      <div class="filters__row filters__row--stack">
        <label class="filters__label" for="mutedInput">Mute words</label>
        <div class="chips" id="mutedChips" role="list"></div>
        <input type="text" id="mutedInput" class="filters__input"
          placeholder="Type a word, press Enter"
          autocomplete="off" />
        <p class="filters__hint">Posts matching any word in content, name, or handle get hidden.</p>
      </div>
    </div>

    <button id="openXBtn" class="btn primary">
      Open X
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/></svg>
    </button>
    <button id="signOutBtn" class="btn ghost">Sign out</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
